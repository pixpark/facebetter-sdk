<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebetter Batch Memory Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Batch Memory Demo</h1>
      <p class="desc">
        连续调用 <code>processImage</code>，观察 JS 堆与 WASM 堆是否持续上涨。
        用于复现「批量处理约 3k 张图」时的内存溢出。
      </p>

      <section class="panel">
        <label>
          循环次数
          <input id="count" type="number" min="1" max="100000" value="3000" />
        </label>

        <label>
          采样间隔（每 N 张记录一次）
          <input id="sampleEvery" type="number" min="1" max="1000" value="100" />
        </label>

        <label>
          保留策略
          <select id="retainMode">
            <option value="discard">丢弃结果（对照：正常用法）</option>
            <option value="keep-last">只保留最后一张</option>
            <option value="keep-all">全部 push 到数组（假泄漏对照）</option>
          </select>
        </label>

        <label>
          尺寸模式
          <select id="sizeMode">
            <option value="fixed">固定尺寸（同输入图）</option>
            <option value="vary">多尺寸轮换（抬高 WASM 峰值）</option>
          </select>
        </label>

        <label class="row">
          <input id="enableBeauty" type="checkbox" checked />
          开启美颜（磨皮 0.6 / 美白 0.4 / 瘦脸 0.3）
        </label>

        <label class="row">
          <input id="enableSkinOnly" type="checkbox" checked />
          开启 setBeautySkinOnly（仅皮肤区域美颜，客户复现关键）
        </label>

        <label>
          输入图
          <input id="file" type="file" accept="image/*" multiple />
        </label>
        <p class="hint">
          可多选；不选则用默认 <code>imgs/demo.jpg</code>（4096×2303）。多张时按顺序循环使用。
        </p>
        <p class="hint">当前输入：<strong id="sourceInfo">加载中…</strong></p>
      </section>

      <section class="actions">
        <button id="btnInit" type="button">1. 初始化引擎</button>
        <button id="btnRun" type="button" disabled>2. 开始批处理</button>
        <button id="btnStop" type="button" disabled>停止</button>
        <button id="btnDestroy" type="button" disabled>销毁引擎</button>
        <button id="btnClearLog" type="button">清空日志</button>
      </section>

      <section class="stats">
        <div><span>输入分辨率</span><strong id="resolution">-</strong></div>
        <div><span>状态</span><strong id="status">未初始化</strong></div>
        <div><span>进度</span><strong id="progress">0 / 0</strong></div>
        <div><span>WASM 堆</span><strong id="wasmHeap">-</strong></div>
        <div><span>JS 堆</span><strong id="jsHeap">-</strong></div>
        <div><span>耗时</span><strong id="elapsed">-</strong></div>
        <div><span>平均</span><strong id="avgMs">-</strong></div>
      </section>

      <canvas id="preview" width="320" height="180"></canvas>

      <pre id="log" class="log"></pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
