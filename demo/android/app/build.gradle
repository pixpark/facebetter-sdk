plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'net.pixpark.fbexample'
    compileSdk = 34

    defaultConfig {
        applicationId = "net.pixpark.fbexample"
        minSdk = 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // 明确指定 NDK 版本和 ABI, 否则不会 strip apk 中 so的符号，体积大
        ndkVersion '25.1.8937393'
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Set fb.local.aar=true in demo/android/local.properties to use the local aar; otherwise Maven is used.
def useLocalFbAar = false
def lp = rootProject.file('local.properties')
if (lp.exists()) {
    def p = new Properties()
    lp.withInputStream { p.load(it) }
    useLocalFbAar = p.getProperty('fb.local.aar', 'false').toBoolean()
}
println "[fb] dep: ${useLocalFbAar ? 'local aar' : 'maven'}"

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    if (useLocalFbAar) {
        implementation files('../../../src/engine/android/facebetter/build/outputs/aar/facebetter.aar')
    } else {
        implementation libs.facebetter
    }

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}